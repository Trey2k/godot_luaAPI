name: ⚙️ Module Unit Tests
on:
  workflow_call:

env:
  BASE_BRANCH: main

jobs:
  module-unit-tests:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    name: Module Unit Tests
    steps:
      - uses: actions/checkout@v3
      - name: Download Editor
        id: download-extension
        uses: actions/download-artifact@v4
        with:
          name: linux-editor
          path: ./
      - name: Unit Tests
        run: |
          rm -rf project/addons
          chmod +x godot.linuxbsd.editor.x86_64.luaAPI
          set -o pipefail
          timeout 300 ./godot.linuxbsd.editor.x86_64.luaAPI --headless --path project/ 2>&1 | tee godot-output.txt
      - name: Verify tests ran
        if: ${{ always() }}
        run: bash scripts/verify_test_log.sh project/log.txt godot-output.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: module-test-results
          path: |
            project/log.txt
            godot-output.txt

  module-unit-tests-luajit:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    name: LuaJIT Module Unit Tests
    steps:
      - uses: actions/checkout@v3
      - name: Download Editor
        id: download-extension
        uses: actions/download-artifact@v4
        with:
          name: linux-editor-luajit
          path: ./
      - name: Unit Testing
        run: |
          rm -rf project/addons
          chmod +x godot.linuxbsd.editor.x86_64.luaAPI
          set -o pipefail
          timeout 300 ./godot.linuxbsd.editor.x86_64.luaAPI --headless --path project/ 2>&1 | tee godot-output.txt
          mv project/log.txt project/jit-log.txt
      - name: Verify tests ran
        if: ${{ always() }}
        run: bash scripts/verify_test_log.sh project/jit-log.txt godot-output.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: module-luajit-test-results
          path: |
            project/jit-log.txt
            godot-output.txt
