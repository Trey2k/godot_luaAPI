name: ⚙️ GDExtension Unit Tests
on:
  workflow_call:
    inputs:
      godot_version:
        description: "Version of godot to be used"
        required: true
        type: string

env:
  BASE_BRANCH: main

jobs:
  gdextension-unit-tests:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    name: GDExtension Unit Tests
    steps:
      - uses: actions/checkout@v3
      - name: Download godot ${{ inputs.godot_version }}
        run: wget -O godot.zip https://github.com/godotengine/godot/releases/download/${{ inputs.godot_version }}-stable/Godot_v${{ inputs.godot_version }}-stable_linux.x86_64.zip
      - name: Extract godot
        run: |
          7z x godot.zip
          mv *_linux.x86_64 godot
      - name: Download Extension
        id: download-extension
        uses: actions/download-artifact@v4
        with:
          pattern: gdextension-lua-*
          merge-multiple: true
          path: project/
      - name: Run Unit Tests
        run: |
          rm -rf project/addons && mv project/container/addons project/addons
          set -o pipefail
          # Any godot-cpp 10 extension that registers a class segfaults Godot
          # 4.7.2's headless editor at shutdown, godot-cpp's own test project
          # included, so the import pass cannot be trusted to exit cleanly. The
          # assets still import; the test run below is the real gate, and
          # verify_test_log.sh fails the job if the extension did not load.
          timeout 300 ./godot --headless --path project/ --import 2>&1 | tee godot-import.txt || true
          timeout 300 ./godot --headless --path project/ 2>&1 | tee godot-output.txt
          mv project/log.txt project/extension-log.txt
      - name: Verify tests ran
        if: ${{ always() }}
        run: bash scripts/verify_test_log.sh project/extension-log.txt godot-output.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gdextension-test-results
          path: |
            project/extension-log.txt
            godot-output.txt

  gdextension-luajit-unit-tests:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    name: LuaJIT GDExtension Unit Tests
    steps:
      - uses: actions/checkout@v3
      - name: Download godot ${{ inputs.godot_version }}
        run: wget -O godot.zip https://github.com/godotengine/godot/releases/download/${{ inputs.godot_version }}-stable/Godot_v${{ inputs.godot_version }}-stable_linux.x86_64.zip
      - name: Extract godot
        run: |
          7z x godot.zip
          mv *_linux.x86_64 godot
      - name: Download Extension
        id: download-extension
        uses: actions/download-artifact@v4
        with:
          pattern: gdextension-luajit-*
          merge-multiple: true
          path: project/
      - name: Run Unit Tests
        run: |
          rm -rf project/addons && mv project/container/addons project/addons
          set -o pipefail
          # Any godot-cpp 10 extension that registers a class segfaults Godot
          # 4.7.2's headless editor at shutdown, godot-cpp's own test project
          # included, so the import pass cannot be trusted to exit cleanly. The
          # assets still import; the test run below is the real gate, and
          # verify_test_log.sh fails the job if the extension did not load.
          timeout 300 ./godot --headless --path project/ --import 2>&1 | tee godot-import.txt || true
          timeout 300 ./godot --headless --path project/ 2>&1 | tee godot-output.txt
          mv project/log.txt project/extension-log.txt
      - name: Verify tests ran
        if: ${{ always() }}
        run: bash scripts/verify_test_log.sh project/extension-log.txt godot-output.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gdextension-luajit-test-results
          path: |
            project/extension-log.txt
            godot-output.txt
