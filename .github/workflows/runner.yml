name: 🔗 GHA
on:
  workflow_dispatch:

  pull_request:
    branches:
      - "*"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "**/*.png"
      - ".github/ISSUE_TEMPLATE/*"
      - ".github/CODEOWNERS"
      - "project/demo/*"
      - ".agents/**"
      - ".claude/**"
  push:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "**/LICENSE"
      - ".github/ISSUE_TEMPLATE/*"
      - ".github/CODEOWNERS"
      - "project/demo/*"
      - ".agents/**"
      - ".claude/**"

env:
  GODOT_VERSION: 4.7.2

jobs:
  static-checks:
    name: 📊 Static checks
    uses: ./.github/workflows/static-checks.yml

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    uses: ./.github/workflows/linux.yml
    with:
      fullbuild: ${{ github.event_name == 'workflow_dispatch' }}
      godot_version: 4.7.2

  macos-build:
    name: 🍎 macOS
    needs: static-checks
    uses: ./.github/workflows/macos-build.yml
    with:
      fullbuild: ${{ github.event_name == 'workflow_dispatch' }}
      godot_version: 4.7.2

  macos-package:
    name: 🍎 macOS Package
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: macos-build
    uses: ./.github/workflows/macos-package.yml
    with:
      fullbuild: ${{ github.event_name == 'workflow_dispatch' }}
      godot_version: 4.7.2

  android-build:
    name: 🤖 Android
    needs: static-checks
    uses: ./.github/workflows/android-build.yml
    with:
      fullbuild: ${{ github.event_name == 'workflow_dispatch' }}
      godot_version: 4.7.2

  android-package:
    name: 🤖 Android Package
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: android-build
    uses: ./.github/workflows/android-package.yml
    with:
      godot_version: 4.7.2

  ios-build:
    name: 🍎 IOS
    needs: static-checks
    uses: ./.github/workflows/ios-build.yml
    with:
      fullbuild: ${{ github.event_name == 'workflow_dispatch' }}
      godot_version: 4.7.2

  ios-package:
    name: 🍎 IOS Package
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: ios-build
    uses: ./.github/workflows/ios-package.yml
    with:
      godot_version: 4.7.2

  web-build:
    name: 🌐 Web
    needs: static-checks
    uses: ./.github/workflows/web.yml
    with:
      fullbuild: ${{ github.event_name == 'workflow_dispatch' }}
      godot_version: 4.7.2

  windows-build:
    name: 🎨 Windows
    needs: static-checks
    uses: ./.github/workflows/windows.yml
    with:
      fullbuild: ${{ github.event_name == 'workflow_dispatch' }}
      godot_version: 4.7.2

  gdextension-build:
    name: ⚙️ GDExtension
    needs: static-checks
    uses: ./.github/workflows/gdextension.yml
    with:
      fullbuild: ${{ github.event_name == 'workflow_dispatch' }}
      godot_version: 4.7.2

  module-unit-tests:
    name: ⚙️ Module Unit Tests
    needs: linux-build
    uses: ./.github/workflows/module-unit-tests.yml

  gdextension-unit-tests:
    name: ⚙️ GDExtension Unit Tests
    needs: gdextension-build
    uses: ./.github/workflows/gdextension-unit-tests.yml
    with:
      godot_version: 4.7.2

  template-version-file:
    name: 📝 Create template version file
    needs: module-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Create version file
        run: |
          mkdir -p ${{ github.workspace }}/bin/templates
          echo ${{ env.GODOT_VERSION }}.stable > ${{ github.workspace }}/bin/templates/version.txt

          mkdir -p ${{ github.workspace }}/bin-mono/templates
          echo ${{ env.GODOT_VERSION }}.stable.mono > ${{ github.workspace }}/bin-mono/templates/version.txt
      - name: Upload version file
        uses: actions/upload-artifact@v4
        with:
          name: module-templates-version
          path: ${{ github.workspace }}/bin/*
      - name: Upload Mono version file
        uses: actions/upload-artifact@v4
        with:
          name: module-mono-templates-version
          path: ${{ github.workspace }}/bin-mono/*

  # Each build job uploads its own piece, because upload-artifact v4 refuses two
  # writes to one name. These jobs put the pieces back together into the
  # artifacts someone actually downloads, and delete-merged removes the pieces.
  merge-gdextension:
    name: 📦 GDExtension
    needs: [gdextension-unit-tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: gdextension
          pattern: gdextension-lua-*
          delete-merged: true

  merge-gdextension-luajit:
    name: 📦 GDExtension LuaJIT
    needs: [gdextension-unit-tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: gdextension-luajit
          pattern: gdextension-luajit-*
          delete-merged: true

  merge-export-templates:
    name: 📦 Export templates
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [template-version-file, linux-build, windows-build, web-build, macos-package, ios-package, android-package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: module-export-templates
          pattern: module-templates-*
          delete-merged: true

  merge-export-templates-mono:
    name: 📦 Export templates (Mono)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [template-version-file, linux-build, windows-build, macos-package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: module-export-templates-mono
          pattern: module-mono-templates-*
          delete-merged: true
