# Non-secret settings for the agent wrappers in .agents/bin. Committed on
# purpose; the tokens themselves live in .agents/secrets and are gitignored.

# owner/name of the GitHub repository agents push to and open PRs against.
GITHUB_REPO="Trey2k/godot_luaAPI"

# Branch every agent branch is cut from and every PR targets.
BASE_BRANCH="main"

# GitHub user to request review from on every PR. While agents authenticate as
# this same account, GitHub rejects the request as self-review and gh-agent.sh
# warns instead of failing. Set it to a different user once per-agent bot
# accounts exist, or leave it empty to skip the request entirely.
PR_REVIEWER="Trey2k"
