# GitHub App id per agent. Committed on purpose: an app id is not a secret, it is
# public on the app's page. The private key is the secret and lives in
# .agents/secrets/github_app_key.<agent>.pem, gitignored.
#
# One app per agent, so a commit and a pull request are authored by that agent's
# own bot user and one agent can be revoked without touching the others. Adding an
# agent means creating an app, installing it on this repository, dropping its key
# in place and adding a line here.
#
# The installation id is deliberately absent: it is looked up at runtime, because
# reinstalling the app changes it and a stale value fails confusingly.

GITHUB_APP_ID_claude=5154233
