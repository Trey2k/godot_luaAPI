# Registry of GitHub Apps used by agents in this repository, keyed
# <github-owner>.<agent>. Committed on purpose: an app id is not a secret, it is
# public on the app's page. The private key is the secret and lives in
# .agents/secrets/github_app_key.<agent>.pem, gitignored.
#
# Keyed by owner as well as agent because more than one person can run a Claude
# agent against this repo. Each person creates their own app, so "claude" alone
# does not identify an app id.
#
# Adding yourself: create an app, install it on this repository, drop its key at
# .agents/secrets/github_app_key.<agent>.pem, and add a line here. If your entry
# is not the only one for that agent, also say which owner you are, either with
# LUA_APP_OWNER in the environment or in .agents/secrets/app_owner (gitignored,
# one line, your GitHub login in lowercase).
#
# The installation id is deliberately absent: it is looked up at runtime, because
# reinstalling the app changes it and a stale value fails confusingly.

declare -A GITHUB_APP_IDS=(
  [trey2k.claude]=5154233
)
